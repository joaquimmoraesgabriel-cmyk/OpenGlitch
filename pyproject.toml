[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openglitch-mcp"
version = "0.1.0"
description = "PageIndex e equipe de agentes para criar jogos 3D cinematográficos, servidos por MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "trafilatura>=2",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pandas>=2.2",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openglitch-mcp = "openglitch_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rede: testes que acessam sites reais (rode com -m rede)"]
addopts = "-m 'not rede'"
